spring:
  application:
    name: wedu-backend

  # 로컬 시크릿(application-secret.yml)이 있으면 자동 병합. 없으면 무시.
  config:
    import: optional:classpath:application-secret.yml

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/wedu?serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 운영/통합 환경은 validate 권장. 로컬 초기 개발은 환경변수로 update 로 덮어 쓴다.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false

  # --- 소셜 로그인(OAuth2) ---
  # client-id/secret 은 환경변수 또는 application-secret.yml(gitignore) 로 주입한다.
  # 로컬 기본값은 플레이스홀더이며, 실제 로그인 전에 콘솔에서 발급한 값으로 덮어쓴다.
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:local-kakao-client-id}
            client-secret: ${KAKAO_CLIENT_SECRET:local-kakao-client-secret}
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope: profile_nickname, account_email
            client-name: Kakao
          google:
            client-id: ${GOOGLE_CLIENT_ID:local-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:local-google-client-secret}
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
            scope: profile, email
            client-name: Google
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# --- JWT ---
jwt:
  # 필수. 환경변수 JWT_SECRET 또는 application-secret.yml 로 주입한다(기본값 없음).
  secret: ${JWT_SECRET}
  access-token-validity-seconds: ${JWT_ACCESS_TTL:3600}

# 소셜 로그인 성공/실패 후 프론트가 토큰을 받는 콜백 URL
wedu:
  oauth2:
    frontend-redirect-uri: ${OAUTH_FRONTEND_REDIRECT_URI:http://localhost:3000/auth/callback}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.wedu: DEBUG
    org.hibernate.SQL: DEBUG
