spring:
  application:
    name: wedu-backend

  # 로컬 시크릿(application-secret.yml)이 있으면 자동 병합. 없으면 무시.
  config:
    import: optional:classpath:application-secret.yml

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Lettuce 연결/명령 timeout (OAuth 코드 발급·교환이 Redis 지연에 장시간 묶이지 않도록)
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_COMMAND_TIMEOUT:2s}

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/wedu?serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 스키마 변경은 Flyway 가 담당. JPA 는 검증만 한다.
      # 로컬 초기 개발은 환경변수로 update 로 덮어 쓸 수 있으나, 가능하면 마이그레이션을 추가한다.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false

  # 스키마 마이그레이션. 빈 DB 는 V001 부터 적용.
  # 기존(수동 적용) DB 는 기동 전 1회 flyway baseline 을 수행한다. 절차는 scripts/migrations/README.md.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # --- 소셜 로그인(OAuth2) ---
  # client-id/secret 은 환경변수 또는 application-secret.yml(gitignore) 로 주입한다.
  # 로컬 기본값은 플레이스홀더이며, 실제 로그인 전에 콘솔에서 발급한 값으로 덮어쓴다.
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:local-kakao-client-id}
            client-secret: ${KAKAO_CLIENT_SECRET:local-kakao-client-secret}
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope: profile_nickname, account_email
            client-name: Kakao
          google:
            client-id: ${GOOGLE_CLIENT_ID:local-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:local-google-client-secret}
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
            scope: profile, email
            client-name: Google
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# --- JWT ---
jwt:
  # 필수. 환경변수 JWT_SECRET 또는 application-secret.yml 로 주입한다(기본값 없음).
  secret: ${JWT_SECRET}
  access-token-validity-seconds: ${JWT_ACCESS_TTL:3600}

# 소셜 로그인 성공/실패 후 프론트가 토큰을 받는 콜백 URL
wedu:
  oauth2:
    frontend-redirect-uri: ${OAUTH_FRONTEND_REDIRECT_URI:http://localhost:5173/auth/callback}
    # 일회용 OAuth 로그인 코드 TTL(초). Redis 키 만료에 사용. Redis 6.2+ (GETDEL) 필요.
    login-code-ttl-seconds: ${OAUTH_LOGIN_CODE_TTL_SECONDS:120}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.wedu: DEBUG
    org.hibernate.SQL: DEBUG
